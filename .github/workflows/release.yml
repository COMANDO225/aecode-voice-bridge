name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write # crear el Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Las coordenadas del servidor se graban al compilar. Sin esto el .exe descargado
      # cae a localhost, sin clave y sin lista de salas: se abre con el desplegable
      # vacío y nada explica por qué. Se leen de variables/secretos del repo para no
      # tenerlas en el código.
      - name: Build Windows .exe (bandeja, sin consola)
        env:
          CGO_ENABLED: '1'
          URL: ${{ vars.BRIDGE_URL }}
          EVENT: ${{ vars.BRIDGE_EVENT }}
          ROOMS: ${{ vars.BRIDGE_ROOMS_URL }}
          KEY: ${{ secrets.BRIDGE_INGEST_KEY }}
        run: >
          go build -ldflags "-H windowsgui -s -w
          -X main.bakedURL=$env:URL
          -X main.bakedEvent=$env:EVENT
          -X main.bakedRoomsURL=$env:ROOMS
          -X main.bakedKey=$env:KEY"
          -o aecode-voice-bridge.exe .
      - name: Subir artefacto (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: aecode-voice-bridge-exe
          path: aecode-voice-bridge.exe
      - name: Publicar Release (en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aecode-voice-bridge.exe
          generate_release_notes: true
